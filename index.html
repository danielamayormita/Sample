
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daniela | My Little Space ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      font-family: 'DM Sans', sans-serif;
      color: #694b58;
      background: linear-gradient(135deg, #fff7fa, #fce4ed, #fff0f5);
      overflow-x: hidden;
    }

    .sparkle {
      position: fixed;
      color: #d98eaa;
      font-size: 25px;
      animation: float 4s ease-in-out infinite;
    }

    .one { top: 12%; left: 12%; }
    .two { top: 20%; right: 15%; animation-delay: 1s; }
    .three { bottom: 15%; left: 17%; animation-delay: 2s; }
    .four { bottom: 20%; right: 12%; animation-delay: 1.5s; }

    @keyframes float {
      50% { transform: translateY(-12px) rotate(15deg); }
    }

    .profile {
      width: 100%;
      max-width: 650px;
      padding: 15px;
      border-radius: 30px;
      background: rgba(255,255,255,0.55);
      box-shadow: 0 20px 60px rgba(180, 105, 139, 0.15);
      animation: appear 1s ease;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      overflow: hidden;
      border-radius: 22px;
      background: #fffafd;
      border: 1px solid #f4dce6;
    }

    .cover {
      height: 170px;
      background: linear-gradient(120deg, #f4bfd2, #f9dce7, #efb5cb);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 65px;
      color: rgba(255,255,255,0.8);
    }

    .avatar {
      width: 110px;
      height: 110px;
      margin: -55px auto 0;
      border: 6px solid #fffafd;
      border-radius: 50%;
      background: #f9dce7;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a95779;
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      box-shadow: 0 5px 20px rgba(169,87,121,0.15);
    }

    .content {
      padding: 20px 30px 30px;
      text-align: center;
    }

    .eyebrow {
      color: #a95779;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(30px, 7vw, 44px);
      color: #75485b;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #a88b98;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .divider {
      width: 50px;
      height: 2px;
      background: #e8abc2;
      margin: 0 auto 25px;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
      text-align: left;
    }

    .detail {
      padding: 20px 17px;
      border-radius: 17px;
      background: #fff4f8;
      border: 1px solid #f4e1e9;
      transition: 0.3s;
    }

    .detail:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(172,102,132,0.12);
    }

    .label {
      display: block;
      color: #b17c91;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .value {
      font-size: 16px;
      font-weight: 600;
      color: #694b58;
    }

    .quote {
      margin-top: 25px;
      padding: 17px;
      border-radius: 15px;
      background: #fff0f5;
      color: #98677d;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 16px;
    }

    footer {
      margin-top: 22px;
      font-size: 10px;
      letter-spacing: 2px;
      color: #b38b9b;
    }

    @media (max-width: 480px) {
      body { padding: 15px; }
      .content { padding: 20px 16px 25px; }
      .details { gap: 9px; }
      .detail { padding: 15px 11px; }
      .value { font-size: 14px; }
    }
  </style>
</head>

<body>

  <span class="sparkle one">✧</span>
  <span class="sparkle two">♡</span>
  <span class="sparkle three">✦</span>
  <span class="sparkle four">✧</span>

  <main class="profile">
    <div class="card">

      <div class="cover">♡ ✿ ♡</div>

      <div class="avatar">D♡</div>

      <div class="content">

        <p class="eyebrow">A Little Introduction</p>

        <h1>Daniela Mayormita</h1>

        <p class="subtitle">
          Welcome to my little space ♡
        </p>

        <div class="divider"></div>

        <div class="details">

          <div class="detail">
            <span class="label">Age</span>
            <span class="value">Your Age</span>
          </div>

          <div class="detail">
            <span class="label">Gender</span>
            <span class="value">Female</span>
          </div>

          <div class="detail">
            <span class="label">Grade / Year Level</span>
            <span class="value">BSIT 4Bl</span>
          </div>

          <div class="detail">
            <span class="label">School Year</span>
            <span class="value">2026 – 2027</span>
          </div>

        </div>

        <div class="quote">
          "Growing at my own pace, blooming in my own way." ♡
        </div>

        <footer>
          MADE WITH LOVE & A LITTLE PINK ✿
        </footer>

      </div>
    </div>
  </main>

</body>
</html>
